name: Daily Trend Menu Report

on:
  schedule:
    # 21:00 UTC = 06:00 KST
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build today's report
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-report.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "trend-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ data/
          git diff --cached --quiet || git commit -m "Daily trend menu report $(date -u +%F)"
          git push
